name = "campus-bites-payments"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Set this to the exact HTTPS origin serving Campus Bites, e.g. https://your-site.pages.dev
ALLOWED_ORIGIN = "https://REPLACE-WITH-YOUR-CAMPUS-BITES-DOMAIN"
# Keep false until server-side menu/catalogue price validation is implemented and tested.
CHECKOUT_ENABLED = "false"

[[d1_databases]]
binding = "DB"
database_name = "campus-bites-payments"
database_id = "REPLACE-WITH-D1-DATABASE-ID"
migrations_dir = "migrations"
